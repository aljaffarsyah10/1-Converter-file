<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sample HTML for PDF</title>
    <style>
        body { font-family: sans-serif; margin: 40px; color: #333; }
        h1 { color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 8px; }
        p { line-height: 1.6; }
        .box { background: #f1f5f9; border-left: 4px solid #3b82f6; padding: 12px 16px; margin: 20px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
        th { background: #e2e8f0; }
    </style>
</head>
<body>
    <h1>Laporan Konversi Dokumen</h1>
    <p>Ini adalah pengujian konversi berkas <strong>HTML ke PDF</strong> menggunakan engine rendering berbasis Chromium/Edge.</p>
    <div class="box">
        <strong>Status:</strong> Siap untuk dikonversi secara 100% offline.
    </div>
    <table>
        <thead>
            <tr><th>No</th><th>Fitur</th><th>Status</th></tr>
        </thead>
        <tbody>
            <tr><td>1</td><td>HTML to PDF</td><td>Aktif</td></tr>
            <tr><td>2</td><td>Markdown to PDF</td><td>Fase 12</td></tr>
        </tbody>
    </table>
</body>
</html>
