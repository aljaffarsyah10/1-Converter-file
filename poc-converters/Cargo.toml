[package]
name = "poc-converters"
version = "0.1.0"
edition = "2021"

[dependencies]
lopdf = "0.35.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = "1.0"
docx-rs = "0.4.22"
pdf-render = "1.2.0"
rust_xlsxwriter = "0.80"
md-5 = "0.10"

[[bin]]
name = "poc_merge"
path = "src/bin/poc_merge.rs"

[[bin]]
name = "poc_split"
path = "src/bin/poc_split.rs"

[[bin]]
name = "poc_img2pdf"
path = "src/bin/poc_img2pdf.rs"

[[bin]]
name = "poc_docx2pdf"
path = "src/bin/poc_docx2pdf.rs"

[[bin]]
name = "poc_pdf_to_word"
path = "src/bin/poc_pdf_to_word.rs"

[[bin]]
name = "poc_pdf_to_image"
path = "src/bin/poc_pdf_to_image.rs"

[[bin]]
name = "poc_compress_pdf"
path = "src/bin/poc_compress_pdf.rs"

[[bin]]
name = "poc_excel_to_pdf"
path = "src/bin/poc_excel_to_pdf.rs"

[[bin]]
name = "poc_pptx_to_pdf"
path = "src/bin/poc_pptx_to_pdf.rs"

[[bin]]
name = "poc_pdf_to_excel"
path = "src/bin/poc_pdf_to_excel.rs"

[[bin]]
name = "poc_rotate_pdf"
path = "src/bin/poc_rotate_pdf.rs"

[[bin]]
name = "poc_test_encryption"
path = "src/bin/poc_test_encryption.rs"

