<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bannerBg)" />
  <rect x="0" y="236" width="1000" height="4" fill="url(#accentGlow)" />

  <!-- Grid decoration lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
    <line x1="960" y1="0" x2="960" y2="240" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Logo Circle -->
  <circle cx="110" cy="120" r="48" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="110" y="132" font-family="system-ui" font-size="38" text-anchor="middle">📄</text>

  <!-- Title & Subtitle -->
  <text x="180" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    File Converter Desktop
  </text>
  <text x="180" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
    Aplikasi desktop offline-first konversi dokumen dan gambar berbasis Tauri 2 + React + Rust
  </text>

  <!-- Badges -->
  <g transform="translate(180, 160)">
    <!-- Badge 1: Offline -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" font-family="system-ui" font-size="11" font-weight="600" fill="#cbd5e1">100% Offline</text>

    <!-- Badge 2: Ultra Fast -->
    <rect x="140" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="152" y="17" font-family="system-ui" font-size="11" font-weight="600" fill="#38bdf8">⚡ Pure Rust Speed</text>

    <!-- Badge 3: Privacy First -->
    <rect x="290" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="302" y="17" font-family="system-ui" font-size="11" font-weight="600" fill="#f472b6">🔒 Zero Telemetry</text>

    <!-- Badge 4: Free & Open -->
    <rect x="435" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="447" y="17" font-family="system-ui" font-size="11" font-weight="600" fill="#fbbf24">📦 Installer ~2 MB</text>
  </g>
</svg>
