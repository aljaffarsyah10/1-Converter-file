<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="958" height="478" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Title Badge -->
  <rect x="340" y="24" width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" />
  <text x="480" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1">ARSITEKTUR OFFLINE-FIRST MVP</text>

  <!-- Box 1: Frontend (React & Tailwind) -->
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="260" height="340" rx="12" fill="#131d31" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="96" width="40" height="40" rx="8" fill="url(#primaryGrad)" />
    <text x="76" y="122" font-family="system-ui" font-size="20" fill="#ffffff" text-anchor="middle">⚛</text>
    <text x="108" y="112" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">Frontend Layer</text>
    <text x="108" y="128" font-family="system-ui" font-size="12" fill="#94a3b8">UI / UX &amp; State</text>

    <!-- Items -->
    <rect x="56" y="152" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="68" y="172" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">React 19 + TypeScript</text>
    <text x="68" y="188" font-family="system-ui" font-size="11" fill="#64748b">Vite 8 • Single-Page Desktop</text>

    <rect x="56" y="210" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="68" y="230" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Tailwind CSS v4 + shadcn/ui</text>
    <text x="68" y="246" font-family="system-ui" font-size="11" fill="#64748b">Radix Nova • Dark/Light Themes</text>

    <rect x="56" y="268" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="68" y="288" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Zustand Global Store</text>
    <text x="68" y="304" font-family="system-ui" font-size="11" fill="#64748b">State file staged, options, progress</text>

    <rect x="56" y="326" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="68" y="346" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Native Window Drag-Drop</text>
    <text x="68" y="362" font-family="system-ui" font-size="11" fill="#64748b">Deteksi path berkas riil desktop</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 300 230 L 350 230" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="350,230 342,225 342,235" fill="#3b82f6" />
  <rect x="296" y="195" width="58" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="325" y="210" font-family="system-ui" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">IPC Invoke</text>

  <!-- Box 2: Tauri IPC & Rust Bridge -->
  <g filter="url(#shadow)">
    <rect x="350" y="80" width="260" height="340" rx="12" fill="#131d31" stroke="#f97316" stroke-width="1.5" />
    <rect x="366" y="96" width="40" height="40" rx="8" fill="url(#rustGrad)" />
    <text x="386" y="122" font-family="system-ui" font-size="20" fill="#ffffff" text-anchor="middle">⚙</text>
    <text x="418" y="112" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">Tauri 2 Core</text>
    <text x="418" y="128" font-family="system-ui" font-size="12" fill="#94a3b8">Async Runtime &amp; Commands</text>

    <rect x="366" y="152" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="378" y="172" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">tauri::async_runtime</text>
    <text x="378" y="188" font-family="system-ui" font-size="11" fill="#64748b">spawn_blocking • UI Zero Freeze</text>

    <rect x="366" y="210" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="378" y="230" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Event Stream Channel</text>
    <text x="378" y="246" font-family="system-ui" font-size="11" fill="#64748b">conversion-progress (0 - 100%)</text>

    <rect x="366" y="268" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="378" y="288" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">tauri-plugin-dialog</text>
    <text x="378" y="304" font-family="system-ui" font-size="11" fill="#64748b">Native file picker &amp; dir selector</text>

    <rect x="366" y="326" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="378" y="346" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">tauri-plugin-opener</text>
    <text x="378" y="362" font-family="system-ui" font-size="11" fill="#64748b">openPath &amp; revealItemInDir</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 610 230 L 660 230" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="660,230 652,225 652,235" fill="#f97316" />
  <rect x="608" y="195" width="54" height="22" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="635" y="210" font-family="system-ui" font-size="10" font-weight="600" fill="#fb923c" text-anchor="middle">Execute</text>

  <!-- Box 3: Rust Conversion Engines -->
  <g filter="url(#shadow)">
    <rect x="660" y="80" width="260" height="340" rx="12" fill="#131d31" stroke="#10b981" stroke-width="1.5" />
    <rect x="676" y="96" width="40" height="40" rx="8" fill="url(#greenGrad)" />
    <text x="696" y="122" font-family="system-ui" font-size="20" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="728" y="112" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">Rust Engines</text>
    <text x="728" y="128" font-family="system-ui" font-size="12" fill="#94a3b8">100% Local File I/O</text>

    <rect x="676" y="152" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="688" y="172" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">lopdf 0.35 (Pure Rust)</text>
    <text x="688" y="188" font-family="system-ui" font-size="11" fill="#64748b">Merge PDF • Split PDF (4-12 ms)</text>

    <rect x="676" y="210" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="688" y="230" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">image 0.25 + flate2</text>
    <text x="688" y="246" font-family="system-ui" font-size="11" fill="#64748b">JPG, PNG, WEBP auto-scale</text>

    <rect x="676" y="268" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="688" y="288" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Word COM / LibreOffice</text>
    <text x="688" y="304" font-family="system-ui" font-size="11" fill="#64748b">DOCX to PDF offline adapter</text>

    <rect x="676" y="326" width="228" height="48" rx="8" fill="#1e293b" />
    <text x="688" y="346" font-family="system-ui" font-size="12" font-weight="600" fill="#e2e8f0">Non-Destructive Storage</text>
    <text x="688" y="362" font-family="system-ui" font-size="11" fill="#64748b">Read-only input • Zero Cloud</text>
  </g>

  <!-- Bottom Privacy Banner -->
  <rect x="40" y="434" width="880" height="30" rx="8" fill="#0f172a" stroke="#1e293b" />
  <text x="480" y="454" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">
    🛡️ <tspan fill="#38bdf8" font-weight="600">Jaminan Privasi &amp; Keamanan:</tspan> Tanpa unggahan cloud, tanpa database eksternal, tanpa akun, tanpa pelacakan telemetri.
  </text>
</svg>

